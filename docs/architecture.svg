<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Lambda architecture for ride-hailing fleet platform">
  <style>
    .title { font: bold 24px Arial, sans-serif; fill: #102a43; }
    .label { font: bold 15px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
    .small { font: 13px Arial, sans-serif; fill: #243b53; text-anchor: middle; }
    .arrow { stroke: #486581; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .speed { fill: #e6f6ff; stroke: #2680c2; stroke-width: 2; }
    .batch { fill: #edf7ed; stroke: #2f855a; stroke-width: 2; }
    .serve { fill: #fff5d6; stroke: #d69e2e; stroke-width: 2; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
  <text x="600" y="35" class="title" text-anchor="middle">Ride-Hailing Fleet Lambda Architecture</text>
  <rect x="35" y="105" width="165" height="88" rx="10" class="speed"/><text x="117" y="140" class="label">Telemetry generator</text><text x="117" y="164" class="small">Python • every 3 sec</text>
  <path d="M200 149 H265" class="arrow"/><rect x="265" y="105" width="145" height="88" rx="10" class="speed"/><text x="337" y="140" class="label">Kafka</text><text x="337" y="164" class="small">fleet-telemetry</text>
  <path d="M410 149 H480" class="arrow"/><rect x="480" y="93" width="190" height="112" rx="10" class="speed"/><text x="575" y="133" class="label">Spark Structured</text><text x="575" y="154" class="label">Streaming</text><text x="575" y="180" class="small">validate • zone • window</text>
  <path d="M670 125 H748" class="arrow"/><rect x="748" y="78" width="180" height="92" rx="10" class="speed"/><text x="838" y="116" class="label">Parquet lake</text><text x="838" y="140" class="small">clean telemetry + metrics</text>
  <path d="M670 178 H748" class="arrow"/><rect x="748" y="202" width="180" height="92" rx="10" class="serve"/><text x="838" y="240" class="label">PostgreSQL</text><text x="838" y="264" class="small">live metric upserts</text>
  <path d="M928 248 H1000" class="arrow"/><rect x="1000" y="202" width="165" height="92" rx="10" class="serve"/><text x="1082" y="240" class="label">FastAPI</text><text x="1082" y="264" class="small">metrics • health • report</text>
  <rect x="35" y="382" width="165" height="88" rx="10" class="batch"/><text x="117" y="417" class="label">Expense generator</text><text x="117" y="441" class="small">Python CSV • 5 min/day</text>
  <path d="M200 426 H265" class="arrow"/><rect x="265" y="382" width="145" height="88" rx="10" class="batch"/><text x="337" y="417" class="label">Airflow</text><text x="337" y="441" class="small">date-aware DAG</text>
  <path d="M410 426 H480" class="arrow"/><rect x="480" y="370" width="190" height="112" rx="10" class="batch"/><text x="575" y="410" class="label">Spark batch</text><text x="575" y="434" class="small">revenue/cost join</text><text x="575" y="458" class="small">profitability report</text>
  <path d="M670 426 H748" class="arrow"/><rect x="748" y="370" width="180" height="112" rx="10" class="batch"/><text x="838" y="410" class="label">Parquet + CSV</text><text x="838" y="434" class="small">daily report</text>
  <path d="M928 426 H1000" class="arrow"/><rect x="1000" y="370" width="165" height="112" rx="10" class="serve"/><text x="1082" y="410" class="label">PostgreSQL</text><text x="1082" y="434" class="small">profitability upsert</text>
  <text x="600" y="545" class="small">Structured JSON logs across every layer • /metrics export • unhealthy after 60 seconds without processed telemetry</text>
</svg>
